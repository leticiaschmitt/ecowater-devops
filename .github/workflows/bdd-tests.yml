name: Testes BDD e contratos - EcoWater
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bdd-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Subir API e SQL Server isolados
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Restaurar dependencias de testes
        run: dotnet restore tests/EcoWater.BddTests/EcoWater.BddTests.csproj
      - name: Compilar suíte de testes
        run: dotnet build tests/EcoWater.BddTests/EcoWater.BddTests.csproj -c Release --no-restore
      - name: Executar BDD
        env:
          ECOWATER_BASE_URL: http://localhost:8080
        run: bash scripts/run-bdd.sh
      - name: Publicar resultados e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecowater-bdd-evidencias
          if-no-files-found: warn
          path: |
            TestResults/Bdd/*.trx
            TestResults/Bdd/**/*.trx
      - name: Salvar logs de containers
        if: always()
        run: docker compose logs --no-color > bdd-container-logs.txt 2>&1 || true
      - name: Publicar logs dos containers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecowater-bdd-containers
          path: bdd-container-logs.txt
      - name: Desligar ambiente
        if: always()
        run: docker compose down -v
