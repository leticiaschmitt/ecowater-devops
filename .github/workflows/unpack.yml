name: Unpack (temporario)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: |
          [ -f projeto.zip ] || { echo "Nada a descompactar"; exit 0; }
          unzip -o projeto.zip
          git rm -q projeto.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona codigo-fonte do projeto EcoWater"
          git push
